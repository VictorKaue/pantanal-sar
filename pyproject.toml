[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pantanal-sar"
version = "0.1.0"
description = "Flood recession and fire mapping in the Pantanal with NISAR GCOV (NASA Space Apps 2026)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
