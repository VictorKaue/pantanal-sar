# Publish the static site in web/ to GitHub Pages on every push to main. No build step:
# web/ is served as is (index.html, css/, js/, data/manifest.json, data/series/, data/layers/).
# One-time manual step: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
